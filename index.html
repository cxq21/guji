d:"catCross",title:"四门相制",sub:!0,paras:["两张主卡<b>门类不同</b>时，看门类：<b>江湖压诗词，诗词惊仙法，仙法化本草，本草解江湖</b>。","武压文、文惊神、神化药、药解武。对面隔着的两门（如 江湖 对 仙法）不判。"],fig:"cats"},{id:"season",title:"应季当令",sub:!0,paras:["书案边挂着本手的季节画，每手轮换：<b>春→夏→长夏→秋→冬→春</b>。","卡的五行与季节相合（<b>春木、夏火、长夏土、秋金、冬水</b>）就得一笔；双方都合，就都得。","季节画下方的小字是<b>下一手</b>的季节，可以提前打算。"],fig:"seasons"},{id:"combo",title:"配伍相助",sub:!0,paras:["有些卡能两张一起扣下（长按卡牌能看到它「配」谁）：本草讲<b>相须、相使</b>，诗词讲<b>对仗、唱和</b>，江湖讲<b>连环</b>，仙法讲<b>合阵</b>。","但如果你的<b>主卡被对方同门相克</b>，这一手配伍不算（判词旁会写「主卡被克，配伍不计」）。","出了配伍双卡多得一笔。辅卡只帮这一笔，它自己的五行、门类不参与比较。"],fig:"combo"},{id:"clash",title:"配伍与相反",paras:["有些卡互相<b>相反、相畏</b>（如本草的「十八反、十九畏」）：自己的两张相反卡不能同出（选辅卡时不会发亮）。","如果你的卡和对方本手的卡相反，<b>双方的配伍这一手都作废</b>，判词会写「相反同案，配伍皆废」。"],fig:null},{id:"tie",title:"和局与积墨",paras:["墨痕一样多时，比双方<b>最重的那一笔</b>，从重到轻：同门相克、五行相克、四门相制、应季当令、配伍相助。重者赢，叫「<b>平笔决胜</b>」。","最重的一笔也一样重，或双方都没占到理，才是「和」：这一手不盖印，墨留在<b>砚池</b>里。","下一手分出胜负时，赢家<b>一次盖两印</b>。积墨最多攒一份，不会越攒越多。","<b>结束</b>：有人先拿到三枚印就赢；任何一方手里没牌了，对局立刻结束，印多的赢，一样多就是和棋。"],fig:"inkstone"},{id:"example",title:"举个例子",paras:["冬天，你扣下一张「水·山水」的诗词卡，对方扣的是「金·边塞」的诗词卡，一起翻开：","同门相克——山水克边塞，你得一笔；五行——水和金不相克，不判；应季当令——冬属水，你又得一笔。","你两笔、对方零笔，你赢这一手，盖一印。"],fig:"example"},{id:"legend",title:"典藏卡",paras:["金边、残卷模样的是<b>典藏卡</b>（传说孤本）。每张带一条特别的「佚文」规则，写在卡上，比如「和局算我胜」。","有一种典藏卡只要<b>握在手里</b>，落子前就能看到对方扣着的那张主卡是哪一门（卡背上会显出「诗词」「本草」等字）。","一个书匣最多带两张典藏，同名只能带一张。"],fig:null},{id:"deck",title:"组牌规则",paras:["书匣恰好十二张。凡品、珍本同名最多两张；典藏同名一张，总共最多两张。","新手有一匣「入门书匣」，四门各三张。游历赢了对手能得新卡，放进收藏册后可以换进书匣。"],fig:null},{id:"tips",title:"小窍门",paras:["<b>长按</b>（电脑上把鼠标停在卡上）任意一张卡，能看到它克谁、怕谁、能和谁配伍。","教学局里长按手牌，还会提示「此时落下」是占上风还是落下风。","对局中随时点「规则」回到这里，对局会暂停；点「返回」接着打。"],fig:null}];var Wt="#2b2620",Hr="#a8392b",jr="#efe4cb";function Pn(e){let t={[J.SPRING]:`<path d="M8 50 Q22 30 40 22 T70 10" stroke="${Wt}" stroke-width="2" fill="none"/><path d="M30 30 q6 -8 14 -10" stroke="${Wt}" stroke-width="1.2" fill="none"/>`+[[40,22],[54,16],[26,34],[62,12],[46,28]].map(([o,n])=>`<circle cx="${o}" cy="${n}" r="3.2" fill="#c98a86"/>`).join(""),[J.SUMMER]:`<path d="M10 56 Q40 48 .qiangjinjiu",kind:Z.DUIZHANG}],clash:[],art:"poem.jingyesi"},{id:"poem.qiangjinjiu",cat:O.POEM,wx:T.FIRE,mood:et.HAOFANG,rarity:B.COMMON,name:"将进酒",text:"君不见黄河之水天上来，奔流到海不复回。",phrase:"金樽豪饮",source:{author:"李白",dynasty:"唐",work:"《将进酒》"},combo:[{id:"poem.jingyesi",kind:Z.DUIZHANG}],clash:[],art:"poem.qiangjinjiu"},{id:"poem.chunyexiyu",cat:O.POEM,wx:T.WOOD,mood:et.SHANSHUI,rarity:B.COMMON,name:"春夜喜雨",text:"好雨知时节，当春乃发生。随风潜入夜，润物细无声。",phrase:"润物无声",source:{author:"杜甫",dynasty:"唐",work:"《春夜喜雨》"},combo:[],clash:[],art:"poem.chunyexiyu"},{id:"poem.chusai",cat:O.POEM,wx:T.EARTH,mood:et.BIANSAI,rarity:B.COMMON,name:"出塞",text:"秦时明月汉时关，万里长征人未还。但使龙城飞将在，不教胡马度阴山。",phrase:"龙城飞将",source:{author:"王昌龄",dynasty:"唐",work:"《出塞》"},combo:[],clash:[],art:"poem.chusai"},{id:"poem.rumengling",cat:O.POEM,wx:T.WOOD,mood:et.WANYUE,rarity:B.COMMON,name:"如梦令",text:"试问卷帘人，却道海棠依旧。知否，知否？应是绿肥红瘦。",phrase:"绿肥红瘦",source:{author:"李清照",dynasty:"宋",work:"《如梦令·昨夜雨疏风骤》"},combo:[{id:"poem.shengshengman",kind:Z.DUIZHANG}],clash:[],art:"poem.rumengling"},{id:"poem.shengshengman",cat:O.POEM,wx:T.METAL,mood:et.WANYUE,rarity:B.RARE,name:"声声慢",text:"寻寻觅觅，冷冷清清，凄凄惨惨戚戚。",phrase:"寻寻觅觅",source:{author:"李清照",dynasty:"宋",work:"《声声慢·寻寻觅觅》"},combo:[{id:"poem.rumengling",kind:Z.DUIZHANG}],clash:[],art:"poem.shengshengman"},{id:"poem.chibi",cat:O.POEM,wx:T.WATER,mood:et.HAOFANG,rarity:B.RARE,name:"赤壁怀古",text:"大江东去，浪淘尽，千古风流人物。",phrase:"大江东去",source:{author:"苏轼",dynasty:"宋",work:"《念奴娇·赤壁怀古》"},combo:[],clash:[],art:"poem.chibi"},{id:"poem.jiuyuejiuri",cat:O.POEM,wx:T.FIRE,mood:et.SIXIANG,rarity:B.COMMON,name:"九月九日",text:"独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。",phrase:"遍插茱萸",source:{author:"王维",dynasty:"唐",work:"《九月九日忆山东兄弟》"},combo:[{id:"poem.shanjuqiuming",kind:Z.DUIZHANG}],clash:[],art:"poem.jiuyuejiuri"}];var Vi=[{id:"herb.huanglian",cat:O.HERB,wx:T.FIRE,nature:rt.HAN,rarity:B.COMMON,name:"黄连",text:"味苦，性寒。归心、脾、胃、肝、胆、大肠经。清热燥湿，泻火解毒。",phrase:"黄连苦寒",herb:{taste:"苦，寒",meridians:["心","脾","胃","肝","胆","大肠"],effect:"清热燥湿，泻火解毒"},source:{work:"
