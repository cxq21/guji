笔墨痕。墨痕多的一方赢这一手、得一印。","<b>补牌</b>：每手结束各摸<b>一张</b>。出两张配伍卡也只摸一张，所以手牌会少一张——配伍要算好时机。季节每手轮换。"],fig:"flow"},{id:"edges",title:"五条上风",paras:["每一手只比<b>主卡</b>。下面五条，占一条就多一笔："],fig:null},{id:"stages",title:"道理一条条学",paras:["五条道理不是一开始全都算。刚开始（教学前几手、第一位对手终南隐士）只算 <b>② 五行相克、③ 四门相制、④ 应季当令</b>；往后的地点再陆续加入 <b>① 同门相克</b> 和 <b>⑤ 配伍相助</b>。","每局开始时，书案上会写明「<b>本局文脉</b>」，也就是这局用哪几条；没开的那条本局不算笔，没开配伍时也不能一次出两张。"],fig:null},{id:"wuxing",rule:"wuxing",title:"② 五行相克",sub:!0,paras:["每张卡都有五行（卡面上的「木火土金水」）。<b>木克土、土克水、水克火、火克金、金克木</b>。","你的五行克住对方的，你得一笔。"],fig:"wuxing"},{id:"catInner",rule:"inner",title:"① 同门相克",sub:!0,paras:["两张主卡<b>门类相同</b>时，比门内属性。箭头指向的一方被克：","只有在圈上<b>挨着</b>的两项才判；隔开的（如 刚 对 快）不判。本草的「平」不参与。","诗词看意境、本草看药性、江湖看刚虚快柔。<b>仙法卡之间没有同门相克</b>，两张仙法相遇只比五行、当令和配伍。"],fig:"rings"},{id:"catCross",rule:"school",title:"③ 四门相制",sub:!0,paras:["两张主卡<b>门类不同</b>时，看门类：<b>江湖压诗词，诗词惊仙法，仙法化本草，本草解江湖</b>。","武压文、文惊神、神化药、药解武。对面隔着的两门（如 江湖 对 仙法）不判。"],fig:"cats"},{id:"season",rule:"season",title:"④ 应季当令",sub:!0,paras:["书案边挂着本手的季节画，每手轮换：<b>春→夏→长夏→秋→冬→春</b>。","卡的五行与季节相合（<b>春木、夏火、长夏土、秋金、冬水</b>）就得一笔；双方都合，就都得。","季节画下方的小字是<b>下一手</b>的季节，可以提前打算。"],fig:"seasons"},{id:"combo",rule:"combo",title:"⑤ 配伍相助",sub:!0,paras:["有些卡能两张一起扣下（长按卡牌能看到它「配」谁）：本草讲<b>相须、相使</b>，诗词讲<b>对仗、唱和</b>，江湖讲<b>连环</b>，仙法讲<b>合阵</b>。","但如果你的<b>主卡被对方同门相克</b>，这一手配伍不算（判词旁会写「主卡被克，配伍不计」）。","出了配伍双卡多得一笔。辅卡只帮这一笔，它自己的五行、门类不参与比较。"],fig:"combo"},{id:"clash",rule:"combo",title:"配伍与相反",paras:["有些卡互相<b>相反、相畏</b>（如本草的「十八反、十九畏」）：自己的两张相反卡不能同出（选辅卡时不会发亮）。","如果你的卡和对方本手的卡相反，<b>双方的配伍这一手都作废</b>，判词会写「相反同案，配伍皆废」。"],fig:null},{id:"tie",title:"和局与积墨",paras:["墨痕一样多时，比双方<b>最重的那一笔</b>，从重到轻：同门相克、五行相克、四门相制、应季当令、配伍相助。重者赢，叫「<b>平笔决胜</b>」。","最重的一笔也一样重，或双方都没占到理，才是「和」：这一手不盖印，墨留在<b>砚池</b>里。","下一手分出胜负时，赢家<b>一次盖两印</b>。积墨最多攒一份，不会越攒越多。","<b>结束</b>：有人先拿到三枚印就赢；任何一方手里没牌了，对局立刻结束，印多的赢，一样多就是和棋。"],fig:"inkstone"},{id:"example",title:"举个例子",paras:["冬天，你扣下一张「水·山水」的诗词卡，对方扣的是「金·边塞」的诗词卡，一起翻开：","同门相克——山水克边塞，你得一笔；五行——水和金不相克，不判；应季当令——冬属水，你又得一笔。","你两笔、对方零笔，你赢这一手，盖一印。"],fig:"example"},{id:"legend",title:"典藏卡",paras:["金边、残卷模样的是<b>典藏卡</b>（传说孤本）。每张带一条特别的「佚文」规则，写在卡上，比如「和局算我胜」。","有一种典藏卡只要<b>握在手里</b>，落子前就能看到对方扣着的那张主卡是哪一门（卡背上会显出「诗词」「本草」等字）。","一个书匣最多带两张典藏，同名只能带一张。"],fig:null},{id:"deck",title:"组牌规则",paras:["书匣恰好十二张。凡品、珍本同名最多两张；典藏同名一张，总共最多两张。","新手有一匣「入门书匣」，四门各三张。游历赢了对手能得新卡，放进收藏册后可以换进书匣。"],fig:null},{id:"tips",title:"小窍门",paras:["<b>长按</b>（电脑上把鼠标停在卡上）任意一张卡，能看到它克谁、怕谁、能和谁配伍。","教学局里长按手牌，还会提示「此时落下」是占上风还是落下风。","对局中随时点「规则」回到这里，对局会暂停；点「返回」接着打。"],fig:null}],Y={demoReplay:"再看",demoNext:"下一门",demoYou:"你",demoFoe:"对手",openTag:"开局",thirdFirst:"上盘负者先手",thirdFirstTie:"上盘和，由首盘后手先手",thirdWho:{me:"你先落子",foe:"对手先落子"},openLine:{me:"开局一子：你的一张牌已在棋盘上",foe:"开局一子：对手的一张牌已在棋盘上"},coachNext:"续",coachDo:"点亮着的牌，再点亮着的格子，最后点「落子」。",coachPreview:"先点亮着的牌，再点上面亮着的格子看预览；然后照提示放。",modeName:{grid:"江湖抢地盘",feihua:"飞花令对子",pharmacy:"药铺配方"},modeLine:{grid:"箭头指谁谁归你",feihua:"对手吟半句，你来接",pharmacy:"轮流下药，配出对症方"},soon:"即将开放",modeTabsLabel:"玩法",firstTime:"初来乍到？先点「教学」，五手就会",me:"我",foe:"彼",meSeal:"朱",foeSeal:"青",boardNo:e=>`第${e}盘`,yourTurn:"轮到你：点一张手牌，再点一个空格",pickCell:"点一个亮着的空格，看看会翻哪几张",confirm:"看好了就点「落子」",commit:"落子",thinking:"对手思索中……",foeHand:"对手手牌",myHand:"我的手牌",willFlip:"会翻",blockedTag:"挡住",flipLine:{arrow:"箭头指着，翻过来",chain:"连环：顺着箭头再翻",cure:"解：翻回自己的牌"},blockLine:{facing:"对箭相抵，翻不动",ferry:"渡口上的牌翻不动",still:"「定」住了，翻不动",steadfast:"不动如山"},boardWin:{me:"这一盘你的颜色多，盖一印",foe:"这一盘对手的颜色多",tie:"两边一样多，此盘不盖印"},nextBoard:"下一盘",over:{win:"三盘两胜，此局胜",lose:"此局负，改日再来",tie:"平手"},feature:{rock:"山石：不能放",ferry:"渡口：放在这里不会被翻",scenic:"名胜：最后算两格"},skill:{still:"定",cure:"解",chain:"连环",pierce:"破"},skillLine:{still:"诗词「定」：到你下次落子前，这张不会被翻",cure:"本草「解」：放下时，被翻走的自己的牌全翻回来",chain:"江湖「连环」：翻过来的牌顺着自己的箭头再翻一次",pierce:"仙法「破」：它的箭头不会被对箭挡住"},skillOff:"本局未开本事",style:"风格",rulesTitle:"江湖抢地盘 · 规则",rules:[{k:"win",h:"怎么赢",t:"三乘三的棋盘，轮流往空格里放一张牌。放满时，谁颜色的格子多谁赢这一盘、盖一印；先赢两盘的人赢。"},{k:"arrow",h:"箭头翻牌",t:"牌边画着箭头。放下时，箭头指着的相邻格里若是对手的牌，就翻成你的颜色（斜箭头翻斜角）。"},{k:"facing",h:"对箭相抵",t:"若那张牌正好有一支箭头指回来，两箭相抵，翻不动。"},{k:"back",h:"翻来翻去",t:"被翻走的牌，之后还能被翻回来——先放哪里、后放哪里很要紧。"},{k:"skills",h:"四门本事",t:"诗词「定」：到你下次落子前不会被翻。本草「解」：身边被翻走的自己的牌全翻回来。江湖
