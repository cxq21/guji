>。下面五条，占一条就多一笔："],fig:null},{id:"stages",title:"道理一条条学",paras:["五条道理不是一开始全都算。刚开始（教学前几手、第一位对手终南隐士）只算 <b>② 五行相克、③ 四门相制、④ 应季当令</b>；往后的地点再陆续加入 <b>① 同门相克</b> 和 <b>⑤ 配伍相助</b>。","每局开始时，书案上会写明「<b>本局文脉</b>」，也就是这局用哪几条；没开的那条本局不算笔，没开配伍时也不能一次出两张。"],fig:null},{id:"wuxing",rule:"wuxing",title:"② 五行相克",sub:!0,paras:["每张卡都有五行（卡面上的「木火土金水」）。<b>木克土、土克水、水克火、火克金、金克木</b>。","你的五行克住对方的，你得一笔。"],fig:"wuxing"},{id:"catInner",rule:"inner",title:"① 同门相克",sub:!0,paras:["两张主卡<b>门类相同</b>时，比门内属性。箭头指向的一方被克：","只有在圈上<b>挨着</b>的两项才判；隔开的（如 刚 对 快）不判。本草的「平」不参与。","诗词看意境、本草看药性、江湖看刚虚快柔。<b>仙法卡之间没有同门相克</b>，两张仙法相遇只比五行、当令和配伍。"],fig:"rings"},{id:"catCross",rule:"school",title:"③ 四门相制",sub:!0,paras:["两张主卡<b>门类不同</b>时，看门类：<b>江湖压诗词，诗词惊仙法，仙法化本草，本草解江湖</b>。","武压文、文惊神、神化药、药解武。对面隔着的两门（如 江湖 对 仙法）不判。"],fig:"cats"},{id:"season",rule:"season",title:"④ 应季当令",sub:!0,paras:["书案边挂着本手的季节画，每手轮换：<b>春→夏→长夏→秋→冬→春</b>。","卡的五行与季节相合（<b>春木、夏火、长夏土、秋金、冬水</b>）就得一笔；双方都合，就都得。","季节画下方的小字是<b>下一手</b>的季节，可以提前打算。"],fig:"seasons"},{id:"combo",rule:"combo",title:"⑤ 配伍相助",sub:!0,paras:["有些卡能两张一起扣下（长按卡牌能看到它「配」谁）：本草讲<b>相须、相使</b>，诗词讲<b>对仗、唱和</b>，江湖讲<b>连环</b>，仙法讲<b>合阵</b>。","但如果你的<b>主卡被对方同门相克</b>，这一手配伍不算（判词旁会写「主卡被克，配伍不计」）。","出了配伍双卡多得一笔。辅卡只帮这一笔，它自己的五行、门类不参与比较。"],fig:"combo"},{id:"clash",rule:"combo",title:"配伍与相反",paras:["有些卡互相<b>相反、相畏</b>（如本草的「十八反、十九畏」）：自己的两张相反卡不能同出（选辅卡时不会发亮）。","如果你的卡和对方本手的卡相反，<b>双方的配伍这一手都作废</b>，判词会写「相反同案，配伍皆废」。"],fig:null},{id:"tie",title:"和局与积墨",paras:["墨痕一样多时，比双方<b>最重的那一笔</b>，从重到轻：同门相克、五行相克、四门相制、应季当令、配伍相助。重者赢，叫「<b>平笔决胜</b>」。","最重的一笔也一样重，或双方都没占到理，才是「和」：这一手不盖印，墨留在<b>砚池</b>里。","下一手分出胜负时，赢家<b>一次盖两印</b>。积墨最多攒一份，不会越攒越多。","<b>结束</b>：有人先拿到三枚印就赢；任何一方手里没牌了，对局立刻结束，印多的赢，一样多就是和棋。"],fig:"inkstone"},{id:"example",title:"举个例子",paras:["冬天，你扣下一张「水·山水」的诗词卡，对方扣的是「金·边塞」的诗词卡，一起翻开：","同门相克——山水克边塞，你得一笔；五行——水和金不相克，不判；应季当令——冬属水，你又得一笔。","你两笔、对方零笔，你赢这一手，盖一印。"],fig:"example"},{id:"legend",title:"典藏卡",paras:["金边、残卷模样的是<b>典藏卡</b>（传说孤本）。每张带一条特别的「佚文」规则，写在卡上，比如「和局算我胜」。","有一种典藏卡只要<b>握在手里</b>，落子前就能看到对方扣着的那张主卡是哪一门（卡背上会显出「诗词」「本草」等字）。","一个书匣最多带两张典藏，同名只能带一张。"],fig:null},{id:"deck",title:"组牌规则",paras:["书匣恰好十二张。凡品、珍本同名最多两张；典藏同名一张，总共最多两张。","新手有一匣「入门书匣」，四门各三张。游历赢了对手能得新卡，放进收藏册后可以换进书匣。"],fig:null},{id:"tips",title:"小窍门",paras:["<b>长按</b>（电脑上把鼠标停在卡上）任意一张卡，能看到它克谁、怕谁、能和谁配伍。","教学局里长按手牌，还会提示「此时落下」是占上风还是落下风。","对局中随时点「规则」回到这里，对局会暂停；点「返回」接着打。"],fig:null}];var ft="#2b2620",qa="#a8392b",Za="#efe4cb";function Oi(e){let t={[ne.SPRING]:`<path d="M8 50 Q22 30 40 22 T70 10" stroke="${ft}" stroke-width="2" fill="none"/><path d="M30 30 q6 -8 14 -10" stroke="${ft}" stroke-width="1.2" fill="none"/>`+[[40,22],[54,16],[26,34],[62,12],[46,28]].map(([o,n])=>`<circle cx="${o}" cy="${n}" r="3.2" fill="#c98a86"/>`).join(""),[ne.SUMMER]:`<path d="M10 56 Q40 48 70 56" stroke="${ft}" stroke-width="1" fill="none" opacity=".5"/><path d="M40 52 V30" stroke="#5d6b4a" stroke-width="1.6"/><path d="M40 30 q-10 -4 -8 -14 q8 2 8 10 q0 -8 8 -10 q2 10 -8 14z" fill="#c98a86"/><ellipse cx="24" cy="50" rx="12" ry="4" fill="#6f7d58"/><ellipse cx="56" cy="51" rx="10" ry="3.5" fill="#6f7d58"/>`,[ne.LATE_SUMMER]:`<path d="M6 54 H74" stroke="${ft}" stroke-width="1" opacity=".5"/>`+[16,28,40,52,64].map((o,n)=>`<path d="M${o} 54 Q${o+2} 36 ${o+8} ${26+n%2*4}" stroke="#8a7a3c" stroke-width="1.4" fill="none"/><ellipse cx="${o+8}" cy="${25+n%2*4}" rx="2.4" ry="5" fill="#b39350" transform="rotate(30 ${o+8} ${25+n%2*4})"/>`).join(""),[ne.AUTUMN]:`<circle cx="58" cy="16" r="7" fill="none" stroke="${ft}" stroke-width="1"/>`+[[14,30],[24,26],[34,32]].map(([o,n])=>`<path d="M${o-5} ${n} l5 3 l5 -3" stroke="${ft}" stroke-width="1.2" fill="none"/>`).join("")+`<path d="M8 56 Q30 40 72 52" stroke="${ft}" stroke-width="1.4" fill="none" opacity=".6"/><path d="M50 44 l4 -6 l4 6 l-4 4z" fill="#a8543b"/>`,[ne.WINTER]:`<path d="M40 56 V18" stroke="${ft}" stroke-width="2"/>`+[22,32,42].map((o,n)=>`<path d="M${26+n*2} ${o+6} L40 ${o} L${54-n*2} ${o+6}" stroke="${ft}" stroke-width="2.4" fill="none"/><path d="M${27+n*2} ${o+4} L40 ${o-2} L${53-n*2} ${o+4}" stroke="#f6f1e6" stroke-width="1.6" fill="none"/>`).join("") text:"味甘、酸、涩，性温。归大肠、胃经。涩肠，止血，生肌敛疮。",phrase:"赤脂涩肠",herb:{taste:"甘、酸、涩，温",meridians:["大肠","胃"],effect:"涩肠，止血，生肌敛疮"},source:{work:"《本草纲目·石部》"},combo:[],clash:[{id:"herb.rougui",kind:Se.XIANGWEI}],art:"herb.chishizhi"}];var _t={work:"《江湖拳谱》"},Kr=[{id:"martial.hengsao",cat:N.MARTIAL,wx:R.METAL,stance:ae.GANG,rarity:F.COMMON,name:"横扫千钧",text:"力自腰起，一扫千钧。以实击虚，势沉如山。",phrase:"横扫千钧",source:_t,combo:[{id:"martial.jinghua",kind:oe.LIANHUAN}],clash:[],art:"martial.hengsao"},{id:"martial.liushui",cat:N.MARTIAL,wx:R.WATER,stance:ae.ROU,rarity:F.COMMON,name:"流水推舟",text:"势如流水，随彼而动。顺势推舟，以柔化刚。",phrase:"流水推舟",source:_t,combo:[],clash:[],art:"martial.liushui"},{id:"martial.jinghua",cat:N.MARTIAL,wx:R.WOOD,stance:ae.XU,rarity:F.COMMON,name:"镜花虚影",text:"身形一晃，虚影重重。花在镜中，引彼空击，实招随后。",phrase:"镜花虚影",source:_t,combo:[{id:"martial.hengsao",kind:oe.LIANHUAN}],clash:[],art:"martial.jinghua"},{id:"martial.jinghong",cat:N.MARTIAL,wx:R.WOOD,stance:ae.KUAI,rarity:F.COMMON,name:"惊鸿一剑",text:"翩若惊鸿，剑出无声。未见其起，已见其落。",phrase:"惊鸿一剑",source:_t,combo:[{id:"martial.taxue",kind:oe.LIANHUAN}],clash:[],art:"martial.jinghong"},{id:"martial.taishan",cat:N.MARTIAL,wx:R.EARTH,stance:ae.GANG,rarity:F.COMMON,name:"泰山压顶",text:"双掌自上而落，如山崩于前。势大力沉，避无可避。",phrase:"泰山压顶",source:_t,combo:[{id:"martial.shengdong",kind:oe.LIANHUAN}],clash:[{id:"martial.huifeng",kind:Se.XIANGCHONG}],art:"martial.taishan"},{id:"martial.jinzhong",cat:N.MARTIAL,wx:R.METAL,stance:ae.GANG,rarity:F.RARE,name:"金钟护体",text:"气贯周身，坚如铜钟。刀剑加身，铮然有声。",phrase:"金钟护体",source:_t,combo:[],clash:[],art:"martial.jinzhong"},{id:"martial.shengdong",cat:N.MARTIAL,wx:R.FIRE,stance:ae.XU,rarity:F.COMMON,name:"声东击西",text:"佯攻其左，意在其右。彼顾此失彼，我乘虚而入。",phrase:"声东击西",source:_t,combo:[{id:"martial.taishan",kind:oe.LIANHUAN}],clash:[],art:"martial.shengdong"},{id:"martial.lingshe",cat:N.MARTIAL,wx:R.FIRE,stance:ae.KUAI,rarity:F.COMMON,name:"灵蛇吐信",text:"指如蛇信，一吐即收。疾若电光，中者方觉。",phrase:"灵蛇吐信",source:_t,combo:[],clash:[],art:"martial.lingshe"},{id:"martial.taxue",cat:N.MARTIAL,wx:R.WATER,stance:ae.KUAI,rarity:F.COMMON,name:"踏雪无痕",text:"足点雪面，身轻如羽。来去无踪，雪上不留一痕。",phrase:"踏雪无痕",source:_t,combo:[{id:"martial.jinghong",kind:oe.LIANHUAN}],clash:[],art:"martial.taxue"},{id:"martial.huifeng",cat:N.MARTIAL,wx:R.WOOD,stance:ae.ROU,rarity:F.COMMON,name:"回风拂柳",text:"袖若柳丝，随风回转。以柔缠刚，拂之即倒。",phrase:"回风拂柳",source:_t,combo:[],clash:[{id:"martial.taishan",kind:Se.XIANGCHONG}],art:"martial.huifeng"}];var At={work:"《云笈符录》"},Yr=[{id:"immortal.zhaoyang",cat:N.IMMORTAL,wx:R.FIRE,yinyang:we.YANG,rarity:F.COMMON,name:"朝阳符",text:"丹书朱篆，引东方初阳之气，照彻幽冥。",phrase:"朝阳丹篆",source:At,combo:[{id:"immortal.qinglong",kind:oe.HEZHEN}],clash:[],art:"immortal.zhaoyang"},{id:"immortal.hanyue",cat:N.IMMORTAL,wx:R.WATER,yinyang:we.YIN,rarity:F.COMMON,name:"寒月咒",text:"月华凝霜，太阴之气，静伏万动。",phrase:"太阴月华",source:At,combo:[],clash:[],art:"immortal.hanyue"},{id:"immortal.qinglong",cat:N.IMMORTAL,wx:R.WOOD,yinyang:we.YANG,rarity:F.COMMON,name:"青龙诀",text:"东方青龙，行云布气。春木发生，万物以荣。",phrase:"青龙行云",source:At,combo:[{id:"immortal.zhaoyang",kind:oe.HEZHEN}],clash:[],art:"immortal.qinglong"},{id:"immortal.zhenyue",cat:N.IMMORTAL,wx:R.EARTH,yinyang:we.YIN,rarity:F.RARE,name:"镇岳符",text:"中央厚土，镇岳安澜。符成如山，不动不摇。",phrase:"镇岳灵符",source:At,combo:[],clash:[],art:"immortal.zhenyue"},{id:"immortal.baihu",cat:N.IMMORTAL,wx:R.METAL,yinyang:we.YIN,rarity:F.COMMON,name:"白虎印",text:"西方白虎，金气肃杀。印落之处，百邪退避。",phrase:"白虎金印",source:At,combo:[{id:"immortal.xuanwu",kind:oe.HEZHEN}],clash:[],art:"immortal.baihu"},{id:"immortal.zhuque",cat:N.IMMORTAL,wx:R.FIRE,yinyang:we.YANG,rarity:F.COMMON,name:"朱雀令",text:"南方朱雀，离火炎上。令旗一展，赤羽满天。",phrase:"朱雀赤羽",source:At,combo:[],clash:[{id:"immortal.xuanwu",kind:Se.XIANGCHONG}],art:"immortal.zhuque"},{id:"immortal.xuanwu",cat:N.IMMORTAL,wx:R.WATER,yinyang:we.YIN,rarity:F.COMMON,name:"玄武咒",text:"北方玄武，龟蛇相缠。坎水深藏，守而不动。",phrase:"玄武龟蛇",source:At,combo:[{id:"immortal.baihu",kind:oe.HEZHEN}],clash:[{id:"immortal.zhuque",kind:Se.XIANGCHONG}],art:"immortal.xuanwu"},{id:"immortal.wulei",cat:N.IMMORTAL,wx:R.WOOD,yinyang:we.YANG,rari
